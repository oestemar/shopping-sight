
{% extends "base.html" %}
{% block title %}{% endblock %}

{% block content %}

    <!-- 商品一覧 -->
    <div class="container mt-4">
        <div class="row row-cols-2 row-cols-md-3 g-4">
            {% for product in products %}
                <div class="col">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">{{ product.name }}</h5>
                            <span class="text-dark fw-bold">{{ product.price }}円</span>                                    
                            <p class="card-text text-truncate">{{ product.description }}</p>     
                            <a href="{{ url_for('shop_product_detail.product_detail', product_id=product.id) }}"
                                class="stretched-link"></a>
                            
                            <div class="mt-auto">                                   
                                <form action="{{ url_for('shop_cart.add_to_cart') }}" method="post" class="mt-auto">
                                    <input type="hidden" name="product_id" value="{{ product.id }}">
                                    <input type="hidden" name="quantity" value="1">
                                    <button class="btn btn-primary" style="position: relative; z-index: 1;">カートに追加</button>
                                </form>
                            </div>  
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>

{% endblock %}
