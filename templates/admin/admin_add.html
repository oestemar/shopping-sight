{% extends "admin/admin_base.html" %}
{% block title %}管理者追加{% endblock %}

{% block content %}
<h2 class="text-center mt-3 mb-4">管理者追加</h2>

<div class="container col-md-4 mx-auto">

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('admins.admin_add_action') }}" method="POST">

        <label>メールアドレス</label>
        <input type="email" name="email" class="form-control" required>

        <label class="mt-3">パスワード</label>
        <input type="password" name="password" class="form-control" required>

        <label class="mt-3">権限（role）</label>
        <input type="text" name="role" class="form-control">

        <button type="submit" class="btn btn-primary mt-4">追加</button>
    </form>
</div>

{% endblock %}
