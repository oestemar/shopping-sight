<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %} - 管理者画面</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome（アイコン） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

{% if login_page %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark text-white">
    <div class="container">
        <div class="navbar-brand">管理者画面</div> 
        <div class="d-flex ms-auto align-items-center"></div>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">メニュー</a>
            </div>       
    </div>
</nav>
{% endif %}
{% if not login_page and session.get("admin_id") %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">

    <a class="navbar-brand" href="{{ url_for('auth.dashboard') }}">
      管理者画面
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="adminNavbar">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('products.product_list') }}">商品管理</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('categories.category_list') }}">カテゴリー管理</a>
        </li>        
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('users.user_list') }}">ユーザー管理</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('admins.admin_list') }}">管理者管理</a>
        </li>

      </ul>

      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link text-warning" href="{{ url_for('auth.logout') }}">
            <i class="fa-solid fa-right-from-bracket"></i> ログアウト
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
{% endif %}
<main class="container py-4">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
