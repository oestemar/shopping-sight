<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shopping-sight{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- ① 最上部：タイトル＋カート -->
    <header class="d-flex justify-content-between align-items-center p-2 border-bottom">
        <div class="h2 m-0">Shopping-sight</div>
        <div class="shop-menu p-2">
            <a href="/" class="text-dark text-decoration-none">メニュー</a>
        </div>  
        <div class="d-flex gap-4 align-items-center">
            <a href="/cart" class="text-dark text-decoration-none h4">
                🛒 (<span id="cart-count">{{ cart_count }}</span>)
            </a>
        </div>
        <div class="shop-login p-2">
            <a href="/shop/login" class="text-dark text-decoration-none">ログイン</a>
        </div>  
        <div class="admin-login p-2">
            <a href="/admin/login" class="text-dark text-decoration-none">管理者ログイン</a>
        </div>  
    </header>

    <!-- ③ 中央メイン：メニュー（タブ切り替え） -->
    <main>
        {% block content %}      
        {% endblock %}
            
        {% if error %}
        <div class="text-white error">{{ error }}</div>
        {% endif %}  
    </main>

    {% block scripts %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
