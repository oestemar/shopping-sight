{% extends "base.html" %}
{% block title %}決済 | Self Drink Bar{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="mt-4 text-center">
        <h2 class="mb-3">決済</h2>
    </div>
    <p class="text-muted text-center">※QRコード決済（ポートフォリオ用）を選択しました。</p>

    <div class="card p-4 shadow-sm mx-auto" style="max-width: 400px;">
        <p class="mb-3 text-center">QRコードを読み取ってください。</p>

        <!-- QRコード画像（自作 or フリー素材） -->
        <div class="qr-image text-center">
            <img src="/static/img/qr_sample.png" alt="QRコード" width="200">
        </div>

        <p id="status" class="text-center fw-bold text-secondary">待機中…</p>
        </div>
    </div>
</div>
<!-- 自動で決済完了へ送信 -->
<form id="autoForm" action="{{ url_for('shop_payment.payment_success', order_id=order_id) }}" method="GET">
    <input type="hidden" name="ic_status" value="success">
</form>

<script>
    // 読み取り演出
    setTimeout(() => {
        document.getElementById("status").textContent = "読み取り中…";
    }, 6000);

    // 決済処理へ自動遷移
    setTimeout(() => {
        const form = document.getElementById("autoForm");
        const url = form.action;
        window.location.href = url;
    }, 6000);
</script>

{% endblock %}
