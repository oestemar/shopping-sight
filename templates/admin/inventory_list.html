{% extends "admin/admin_base.html" %}
{% block title %}在庫一覧{% endblock %}

{% block content %}
<div class="container">
    <h2 class="mb-4">在庫一覧</h2>

    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>商品名</th>
                <th>SKU</th>
                <th>在庫数</th>
                <th>更新</th>
                <th>履歴</th>
            </tr>
        </thead>
        <tbody>
            {% for p in products %}
            <tr>
                <td>{{ p.id }}</td>
                <td>{{ p.name }}</td>
                <td>{{ p.sku }}</td>
                <td>{{ p.stock }}</td>

                <td>
                    <a href="{{ url_for('inventory.inventory_update_form', product_id=p.id) }}"
                       class="btn btn-outline-primary btn-sm">在庫更新</a>
                </td>

                <td>
                    <a href="{{ url_for('inventory.inventory_history_product', product_id=p.id) }}"
                       class="btn btn-outline-dark btn-sm">履歴</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="mt-3">
        <a href="{{ url_for('inventory.inventory_history') }}" class="btn btn-dark">
            在庫履歴（全体）
        </a>
    </div>
</div>
{% endblock %}
